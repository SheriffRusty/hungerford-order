var currentSection = '';
var container = document.getElementById('menu');

menuData.forEach(function(row) {
  if (row.s) {
    currentSection = row.s;
    var div = document.createElement('div');
    div.className = 'section';
    div.textContent = row.s;
    container.appendChild(div);
  } else {
    var div = document.createElement('div');
    div.className = 'item';
    div.dataset.section = currentSection;
    div.dataset.no = row.n;
    div.dataset.name = row.d;
    div.dataset.price = row.p;
    div.innerHTML =
      '<div class="tick"></div>' +
      '<div class="item-body">' +
        '<div class="item-name">' + row.d + '</div>' +
        '<div class="item-no">No. ' + row.n + '</div>' +
      '</div>' +
      '<div class="item-price">£' + row.p + '</div>';
    div.addEventListener('click', function() {
      this.classList.toggle('checked');
    });
    container.appendChild(div);
  }
});

function buildMessage(group) {
  var checked = document.querySelectorAll('.item.checked');
  if (checked.length === 0) { return null; }
  var sections = {};
  var order = [];
  checked.forEach(function(item) {
    var sec = item.dataset.section;
    if (!sections[sec]) { sections[sec] = []; order.push(sec); }
    sections[sec].push('[' + item.dataset.no + '] ' + item.dataset.name + ' - £' + item.dataset.price);
  });
  var msg = 'ORDER - ' + group + '\n\n';
  order.forEach(function(sec) {
    msg += sec + '\n';
    sections[sec].forEach(function(line) { msg += '  ' + line + '\n'; });
    msg += '\n';
  });
  return msg.trim();
}

document.querySelectorAll('.btn').forEach(function(btn) {
  btn.addEventListener('click', function(e) {
    e.preventDefault();
    var group = this.dataset.group;
    var msg = buildMessage(group);
    var warning = document.getElementById('warning');
    if (!msg) {
      warning.style.display = 'block';
      setTimeout(function() { warning.style.display = 'none'; }, 3000);
      return;
    }
    warning.style.display = 'none';
    window.location.href = 'https://wa.me/447831124282?text=' + encodeURIComponent(msg);
  });
});
