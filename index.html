(function(){
  var tbody=document.getElementById('body');
  menu.forEach(function(item){
    var tr=document.createElement('tr');
    if(item.s){
      tr.className='sec';
      var td=document.createElement('td');
      td.colSpan=7;
      td.textContent=item.s;
      tr.appendChild(td);
    } else {
      tr.className='item';
      tr.innerHTML=
        '<td class="nc">'+item.n+'</td>'+
        '<td class="dc">'+item.d+'</td>'+
        '<td class="pc">£'+item.p+'</td>'+
        '<td class="xc"><div class="tick" data-n="'+item.n+'" data-g="b"></div></td>'+
        '<td class="xc"><div class="tick" data-n="'+item.n+'" data-g="w"></div></td>'+
        '<td class="xc"><div class="tick" data-n="'+item.n+'" data-g="a"></div></td>'+
        '<td class="rc" id="r'+item.n+'"></td>';
    }
    tbody.appendChild(tr);
  });
})();

function renderTick(el,on){
  el.textContent=on?'✓':'';
  on?el.classList.add('on'):el.classList.remove('on');
}

function renderAll(){
  document.querySelectorAll('.tick').forEach(function(el){
    var s=state[el.dataset.n]||{};
    renderTick(el,!!s[el.dataset.g]);
  });
  recalc();
}

function recalc(){
  var tb=0,tw=0,ta=0;
  menu.forEach(function(item){
    if(!item.n)return;
    var s=state[item.n]||{};
    var p=parseFloat(item.p);
    var ct=(s.b?1:0)+(s.w?1:0)+(s.a?1:0);
    var el=document.getElementById('r'+item.n);
    if(el)el.textContent=ct?'£'+(p*ct).toFixed(2):'';
    if(s.b)tb+=p;
    if(s.w)tw+=p;
    if(s.a)ta+=p;
  });
  var tt=tb+tw+ta;
  var f=function(v){return'£'+v.toFixed(2);};
  document.getElementById('tb').textContent=f(tb);
  document.getElementById('tw').textContent=f(tw);
  document.getElementById('ta').textContent=f(ta);
  document.getElementById('tt').textContent=f(tt);
  document.getElementById('fb').textContent=f(tb);
  document.getElementById('fw').textContent=f(tw);
  document.getElementById('fa').textContent=f(ta);
  document.getElementById('ft').textContent=f(tt);
}

function applyPatch(path,data){
  if(path==='/'){state=data||{};return;}
  var parts=path.replace(/^\//,'').split('/');
  if(parts.length===1){
    if(data===null)delete state[parts[0]];
    else state[parts[0]]=data||{};
  } else if(parts.length===2){
    if(!state[parts[0]])state[parts[0]]={};
    if(data===null)delete state[parts[0]][parts[1]];
    else state[parts[0]][parts[1]]=data;
  }
}

document.addEventListener('click',function(e){
  var el=e.target.closest('.tick');
  if(!el)return;
  var n=el.dataset.n,g=el.dataset.g;
  var cur=(state[n]&&state[n][g])||false;
  var val=!cur;
  if(!state[n])state[n]={};
  state[n][g]=val;
  renderTick(el,val);
  recalc();
  fetch(DB+'/orders/'+encodeURIComponent(n)+'/'+g+'.json',{
    method:'PUT',
    body:JSON.stringify(val),
    headers:{'Content-Type':'application/json'}
  }).catch(function(){
    state[n][g]=cur;
    renderTick(el,cur);
    recalc();
  });
});

var statusEl=document.getElementById('status');
var es=new EventSource(DB+'/orders.json');
es.addEventListener('put',function(e){
  var p=JSON.parse(e.data);
  applyPatch(p.path,p.data);
  renderAll();
});
es.addEventListener('patch',function(e){
  var p=JSON.parse(e.data);
  var d=p.data||{};
  Object.keys(d).forEach(function(k){applyPatch(p.path+'/'+k,d[k]);});
  renderAll();
});
es.onopen=function(){statusEl.textContent='Live •';};
es.onerror=function(){statusEl.textContent='Reconnecting…';};
</script>
